name: Verificar directorios oficiales
on:
  push:
    branches: [codex/auditoria-android-2026-10-15]
    paths: ['scripts/inspect-official-sources.py', '.github/workflows/official-sources.yml']
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/inspect-official-sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: directorios-oficiales
          path: artifacts/

name: Android de prueba
on:
  push:
    branches: [codex/auditoria-android-2026-10-15]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar dependencias fijadas
        run: npm ci --no-audit --no-fund
      - name: Pruebas de datos y sintaxis
        run: npm test
      - name: Auditoría de dependencias de ejecución
        run: |
          mkdir -p artifacts
          npm audit --omit=dev --audit-level=high --json > artifacts/npm-audit.json
      - name: Navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: Comprobar servicio existente desde el origen Android
        run: node scripts/check-service.mjs
      - name: Regresión de funciones existentes
        run: npm run test:browser
      - name: Estado del proveedor gastronómico externo (sin ocultar caídas)
        continue-on-error: true
        run: node scripts/check-dining.mjs
      - name: Preparar aplicación Android
        run: npm run android:sync
      - name: SDK Android
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compilar y analizar
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug bundleRelease
      - name: Comprobar firma y permisos del APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > APK-SHA256.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk > APK-METADATA.txt
      - name: APK de distribución con firma persistente
        env:
          VF_SIGNING_KEYSTORE_BASE64: ${{ secrets.VF_SIGNING_KEYSTORE_BASE64 }}
          VF_SIGNING_STORE_PASSWORD: ${{ secrets.VF_SIGNING_STORE_PASSWORD }}
          VF_SIGNING_ALIAS: ${{ secrets.VF_SIGNING_ALIAS }}
          VF_SIGNING_KEY_PASSWORD: ${{ secrets.VF_SIGNING_KEY_PASSWORD }}
          VF_SIGNING_CERT_SHA256: ${{ secrets.VF_SIGNING_CERT_SHA256 }}
        run: bash scripts/sign-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ViajaFacil-Android-firma-fija
          if-no-files-found: ignore
          retention-days: 30
          path: artifacts/distribucion/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ViajaFacil-Android-informes
          if-no-files-found: warn
          retention-days: 30
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/
            artifacts/*.json
            APK-SHA256.txt
            APK-METADATA.txt
            package-lock.json

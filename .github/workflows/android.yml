name: Android de prueba
on:
  push:
    branches: [codex/auditoria-android-2026-10-15]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Instalar dependencias fijadas
        run: npm install --no-audit --no-fund
      - name: Pruebas de datos y sintaxis
        run: npm test
      - name: Navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: Regresión de funciones existentes
        run: npm run test:browser
      - name: Preparar aplicación Android
        run: npm run android:sync
      - name: SDK Android
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compilar y analizar
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug bundleRelease
      - name: Comprobar firma y permisos del APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > APK-SHA256.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk > APK-METADATA.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ViajaFacil-Android-prueba
          if-no-files-found: warn
          retention-days: 30
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/
            artifacts/
            APK-SHA256.txt
            APK-METADATA.txt
            package-lock.json

name: Comprobar gastronomía existente
on:
  push:
    branches: [codex/auditoria-android-2026-10-15]
    paths: [.github/workflows/food-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico acotado de Overpass
        run: |
          node --input-type=module <<'JS'
          for(const memory of [2097152,33554432]){
            const query='[out:json][timeout:15][maxsize:'+memory+'];nwr(around:2000,34.0522,-118.2437)["amenity"~"^(restaurant|cafe|bar|pub|fast_food|ice_cream)$"]["name"];out center 80;';
            const url=new URL('https://overpass.private.coffee/api/interpreter');url.searchParams.set('data',query);
            try{const r=await fetch(url,{headers:{'User-Agent':'ViajaFacil/0.18 (https://github.com/juangarce34-blip/Viajaf-cil-)'},signal:AbortSignal.timeout(20000)});const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{}console.log(JSON.stringify({memory,status:r.status,count:data?.elements?.length,remark:data?.remark,body:r.ok?undefined:raw.slice(0,1500)}));}catch(e){console.log(JSON.stringify({memory,error:e.message}));}
          }
          JS

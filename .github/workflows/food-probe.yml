name: Comprobar gastronomía existente
on:
  push:
    branches: [codex/auditoria-android-2026-10-15]
    paths: [.github/workflows/food-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar POST recomendado por el operador
        run: |
          node --input-type=module <<'JS'
          const query='[out:json][timeout:15];node(around:1000,34.0522,-118.2437)["amenity"="restaurant"];out 10;';
          const r=await fetch('https://overpass.private.coffee/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','User-Agent':'ViajaFacil/0.18 (https://github.com/juangarce34-blip/Viajaf-cil-)'},body:'data='+encodeURIComponent(query),signal:AbortSignal.timeout(20000)});
          const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{}
          console.log(JSON.stringify({status:r.status,count:data?.elements?.length,remark:data?.remark,body:r.ok?undefined:raw.slice(0,1000)}));
          JS
